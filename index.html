<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<meta name="description" content="Меняет соотношение сторон видео без обрезки. Всё работает в браузере, файлы никуда не загружаются.">
<title>Aspect Studio Video</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <h1>Aspect Studio <span>Video</span></h1>
  <p class="sub">Меняет формат видео без обрезки. Всё на вашем устройстве.</p>
</header>

<main>
  <section id="drop" class="drop" tabindex="0" role="button" aria-label="Выбрать видео">
    <div class="drop-icon" aria-hidden="true">🎬</div>
    <strong>Выберите видео</strong>
    <span>или перетащите файл сюда</span>
    <input id="file" type="file" accept="video/*" hidden>
  </section>

  <div id="editor" class="editor" hidden>
    <section class="stage">
      <canvas id="preview" aria-label="Предпросмотр"></canvas>
      <video id="video" playsinline preload="auto" hidden></video>
      <div class="transport">
        <button id="play" class="btn icon" aria-label="Играть">▶</button>
        <input id="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="Позиция">
        <span id="time" class="mono">0:00.0</span>
      </div>
      <p id="info" class="info"></p>
    </section>

    <section class="panel">
      <h2>Формат</h2>
      <div id="presets" class="chips"></div>
      <div class="custom">
        <label>Свой:
          <input id="cw" type="number" min="1" max="100" value="9" inputmode="numeric"> :
          <input id="ch" type="number" min="1" max="100" value="16" inputmode="numeric">
        </label>
      </div>

      <h2>Заполнение пустых полей</h2>
      <div id="modes" class="seg" role="radiogroup">
        <button data-mode="blur" class="on" role="radio" aria-checked="true">Размытие</button>
        <button data-mode="color" role="radio" aria-checked="false">Цвет</button>
        <button data-mode="crop" role="radio" aria-checked="false">Обрезать</button>
      </div>
      <label id="colorRow" class="row" hidden>Цвет фона
        <input id="color" type="color" value="#000000">
      </label>

      <h2>Фрагмент</h2>
      <div class="trim">
        <label>Начало <span id="startLbl" class="mono">0:00.0</span>
          <input id="start" type="range" min="0" max="1" step="0.1" value="0">
        </label>
        <label>Конец <span id="endLbl" class="mono">0:00.0</span>
          <input id="end" type="range" min="0" max="1" step="0.1" value="1">
        </label>
      </div>

      <h2>Качество</h2>
      <div class="grid2">
        <label>Размер
          <select id="short">
            <option value="0">Авто (как у исходника)</option>
            <option value="480">480p</option>
            <option value="720">720p</option>
            <option value="1080" selected>1080p</option>
            <option value="1440">1440p</option>
            <option value="2160">2160p (4K)</option>
          </select>
        </label>
        <label>Кадров/с
          <select id="fps">
            <option value="24">24</option>
            <option value="30" selected>30</option>
            <option value="60">60</option>
          </select>
        </label>
        <label>Битрейт
          <select id="quality">
            <option value="0.07">Компактный</option>
            <option value="0.12" selected>Хороший</option>
            <option value="0.2">Максимальный</option>
          </select>
        </label>
        <label class="check"><input id="mute" type="checkbox"> Без звука</label>
      </div>

      <button id="export" class="btn primary">Сохранить видео</button>
      <div id="progress" class="progress" hidden>
        <div class="bar"><i id="bar"></i></div>
        <p id="ptext">…</p>
        <button id="cancel" class="btn">Отмена</button>
      </div>
      <p id="note" class="note" hidden></p>
      <button id="other" class="btn link">Выбрать другое видео</button>
    </section>

    <section id="result" class="panel result" hidden>
      <h2>Готово</h2>
      <video id="resultVideo" controls playsinline></video>
      <p id="resultInfo" class="info"></p>
      <div class="actions">
        <a id="download" class="btn primary" download>Скачать</a>
        <button id="share" class="btn" hidden>Поделиться</button>
      </div>
    </section>
  </div>
</main>

<footer>Файлы не покидают устройство · v1.0.0</footer>

<script src="vendor/mp4-muxer.js"></script>
<script src="js/render.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>
</body>
</html>
